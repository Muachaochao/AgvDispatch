name: AgvDispatch CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore service
        run: dotnet restore AgvDispatch.Service/AgvDispatch.Service.csproj
      - name: Build service
        run: dotnet build AgvDispatch.Service/AgvDispatch.Service.csproj -c Release --no-restore -m:1
      - name: Build web host
        run: dotnet build AgvDispatch.WebHost/AgvDispatch.WebHost.csproj -c Release --no-restore -m:1
      - name: Build WPF
        run: dotnet build AgvDispatch.Wpf/AgvDispatch.Wpf.csproj -c Release --no-restore -m:1
      - name: Core smoke tests
        shell: pwsh
        run: ./tools/Test-CoreSmoke.ps1
